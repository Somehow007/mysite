<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <!-- interactive-widget=resizes-content：Android Chrome 108+ 软键盘弹起时同步收缩布局视口，
         配合 dvh / --vvh 让 fixed 弹层（如 AI 聊天 sheet）不被键盘遮挡；iOS Safari 忽略该值，由 useVisualViewport 兜底 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="MySite - 个人博客">
    <!-- 站点级 OG 兜底：unhead 会按 key 收养这些静态标签并在运行时按页面刷新；
         不支持 JS 的爬虫/分享预览也能拿到基本卡片 -->
    <meta property="og:title" content="MySite">
    <meta property="og:description" content="MySite - 个人博客">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MySite">
    <meta property="og:locale" content="zh_CN">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
    <meta name="format-detection" content="telephone=no">
    <title>MySite</title>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/noto-serif-sc-core.woff2" crossorigin>
  </head>
  <body>
    <script>
      ;(function(){var t=null;try{t=localStorage.getItem('mysite_theme_v2')}catch(e){}var d=t?t.includes('dark')||t==='aurora':matchMedia('(prefers-color-scheme: dark)').matches;var theme=t||(d?'paper-dark':'paper-light');document.documentElement.setAttribute('data-theme',theme);document.documentElement.classList.toggle('dark',d);document.documentElement.style.colorScheme=d?'dark':'light'})()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
